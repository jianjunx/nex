[package]
name = "nex"
version = "1.1.0"
description = "Nex - AI Agent Integration Environment. Unify Claude Code, Codex, Cursor CLI, Opencode and more into one workspace."
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
git2 = "0.19"
which = "7"
portable-pty = "0.8"
notify = "7"
notify-debouncer-full = "0.4"
ignore = "0.4"
globset = "0.4"
regex = "1"
content_inspector = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
futures = "0.3"
agent-client-protocol = { path = "patches/agent-client-protocol", features = ["unstable"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "4.2.0"
sha2 = "0.10.9"
flate2 = "1.1.9"
tar = "0.4.46"
trash = "5"
semver = "1"
dirs = "5"
serde_yaml = "0.9"
base64 = "0.22"
calamine = "0.30.1"

[dev-dependencies]
tempfile = "3"

# macOS 静态链接 OpenSSL：git2/libgit2 默认动态链接系统 libssl.3.dylib，
# 未装 Homebrew 的机器启动崩溃（Library not loaded）。vendored 从源码编译并
# 静态链接进二进制。仅 macOS 需要——Windows 走 schannel，Linux 用系统 OpenSSL，
# 全局声明会让所有平台都编译 OpenSSL 源码（Windows 还需要 perl）。
[target.'cfg(target_os = "macos")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
